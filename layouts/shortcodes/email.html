{{- $user := .Get "user" -}}
{{- $domain := .Get "domain" -}}
{{- $label := .Get "label" | default "Click to reveal email" -}}
<span class="obf-email" data-u="{{ $user | base64Encode }}" data-d="{{ $domain | base64Encode }}">
  <button type="button" class="obf-email-btn">{{ $label }}</button>
</span>
<script>
(function () {
  document.querySelectorAll('.obf-email').forEach(function (el) {
    el.querySelector('button').addEventListener('click', function () {
      var addr = atob(el.dataset.u) + '@' + atob(el.dataset.d);
      var a = document.createElement('a');
      a.href = 'mailto:' + addr;
      a.textContent = addr;
      el.replaceChildren(a);
    });
  });
})();
</script>
