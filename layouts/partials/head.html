{{- /* Include PaperMod's default structural head assets first */ -}}
{{- template "partials/templates/head.html" . -}}

{{- /* Force Inject Your JSON-LD Globally */ -}}
{{- if .IsHome -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": {{ .Site.Title }},
  "url": {{ .Site.BaseURL }}
}
</script>
{{- else if .IsPage -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": {{ .Title }},
  "url": {{ .Permalink }},
  "datePublished": "{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}"
}
</script>
{{- end -}}
